[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "angiotda"
version = "0.2.0"
description = "Graph-based self-supervised phenotypic profiling of endothelial tube-formation assays"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Mahmoud Gamal"}, {name = "Mahmood Alzubaidi"}, {name = "Uzair Shah"}, {name = "Ayman Al Haj Zen"}, {name = "Marco Agus"}]
dependencies = ["torch>=2.5", "torch-geometric>=2.6", "numpy>=1.26", "scipy>=1.11", "scikit-learn>=1.3", "pyyaml>=6", "tifffile", "pillow>=10", "matplotlib>=3.8", "networkx>=3.2", "huggingface-hub>=0.24"]

[project.optional-dependencies]
graphs = ["scikit-image==0.25.2", "skan>=0.12,<0.14", "pandas>=2"]
analysis = ["pandas>=2", "pyarrow>=14", "openpyxl>=3.1"]

[project.scripts]
angiotda = "angiotda.cli:main"

[project.urls]
Repository = "https://github.com/mahmoudgamal0/AngioTDA"

[tool.setuptools.packages.find]
include = ["angiotda*"]
